name: 'sql_data_warehouse'
version: '1.0.0'
config-version: 2

# This profile must exist in your profiles.yml (see profiles.yml.example).
profile: 'sql_data_warehouse'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Layered architecture mirrors the original bronze -> silver -> gold design:
#   seeds        = bronze (raw source data, loaded as-is from CSV)
#   staging      = silver (cleansing, casting, standardisation; 1:1 with sources)
#   intermediate = business-logic joins
#   marts        = gold   (star schema: fct_ + dim_ for analytics)
models:
  sql_data_warehouse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  sql_data_warehouse:
    +schema: bronze
    crm_sales_details:
      +column_types:
        sls_order_dt: bigint
        sls_ship_dt: bigint
        sls_due_dt: bigint
        sls_sales: bigint
        sls_quantity: bigint
        sls_price: bigint
